<html lang="pl">
<head>
<meta charset="UTF-8">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --orange:#F58220;--orange-light:#FFF5EB;--orange-glow:rgba(245,130,32,.12);
  --purple:#6F499D;--purple-light:#F3F0F8;--purple-glow:rgba(111,73,157,.10);
  --green:#16A34A;--green-bg:#F0FDF4;
  --red:#DC2626;--red-bg:#FEF2F2;
  --bg:#FAFAF9;--card:#fff;--text:#1C1917;--muted:#78716C;--border:#E7E5E4;
  --radius:14px;--font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font);color:var(--text);background:var(--bg);
  min-height:100vh;display:flex;justify-content:center;padding:28px 16px 60px;
  background-image:
    radial-gradient(ellipse 80% 60% at 20% 0%,var(--orange-glow),transparent),
    radial-gradient(ellipse 60% 50% at 85% 100%,var(--purple-glow),transparent);
}
.quiz{width:100%;max-width:660px;display:flex;flex-direction:column;gap:20px}

/* ---- header ---- */
.header{display:flex;justify-content:space-between;align-items:center}
.header-title{font-size:1.15rem;font-weight:800;color:var(--purple);letter-spacing:-.02em}
.header-counter{
  font-family:var(--mono);font-size:.82rem;font-weight:500;
  color:var(--muted);background:var(--purple-light);padding:4px 14px;border-radius:20px;
}

/* ---- progress ---- */
.progress-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),#F6A54B);border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ---- card ---- */
.card{
  background:var(--card);border-radius:var(--radius);padding:32px 28px;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.03);
  border:1px solid var(--border);
  animation:cardIn .35s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.question{font-size:1.06rem;font-weight:600;line-height:1.55;margin-bottom:22px;color:var(--text)}
.question code{
  font-family:var(--mono);font-size:.92em;background:var(--purple-light);
  padding:1px 7px;border-radius:6px;color:var(--purple);font-weight:500;
}

/* ---- options ---- */
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  border:2px solid var(--border);border-radius:12px;background:var(--card);
  cursor:pointer;transition:all .15s ease;text-align:left;width:100%;
  font-family:var(--font);font-size:.94rem;line-height:1.4;color:var(--text);
  outline:none;
}
.opt:hover:not(.locked){border-color:#D6D3D1;background:#FAFAF9}
.opt.selected{border-color:var(--purple);background:var(--purple-light)}
.opt.selected .letter{background:var(--purple);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt.wrong .opt-text{text-decoration:line-through;opacity:.55}
.opt.dimmed{opacity:.38;pointer-events:none}
.opt.locked{cursor:default}
.letter{
  width:32px;height:32px;min-width:32px;border-radius:8px;
  background:#F5F5F4;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.82rem;color:var(--muted);transition:all .15s ease;
}
.opt-text{flex:1}
.opt-text code{
  font-family:var(--mono);font-size:.88em;background:var(--purple-light);
  padding:1px 6px;border-radius:5px;color:var(--purple);font-weight:500;
}

/* ---- feedback ---- */
.feedback{
  margin-top:16px;padding:12px 16px;border-radius:10px;
  border-left:4px solid;font-size:.93rem;font-weight:600;
  animation:fadeIn .25s ease both;
}
.feedback.ok{background:var(--green-bg);border-left-color:var(--green);color:#15803D}
.feedback.nope{background:var(--red-bg);border-left-color:var(--red);color:#991B1B}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- buttons ---- */
.btn-row{display:flex;justify-content:flex-end;margin-top:18px}
.btn{
  font-family:var(--font);padding:12px 34px;border:none;border-radius:10px;
  font-size:.94rem;font-weight:700;cursor:pointer;transition:all .15s ease;
}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.35;cursor:default;filter:none;transform:none}

/* ---- score pill ---- */
.score-pill{
  align-self:center;font-size:.84rem;font-weight:700;
  color:var(--purple);background:var(--purple-light);
  padding:7px 22px;border-radius:20px;
}

/* ---- result ---- */
.result{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 28px}
.result-emoji{font-size:3.4rem}
.result-score{font-size:2.4rem;font-weight:800;color:var(--purple);letter-spacing:-.03em}
.result-pct{font-size:1.2rem;font-weight:700;color:var(--orange)}
.result-msg{font-size:1rem;color:var(--muted);text-align:center;line-height:1.5;max-width:340px}
.result .btn{margin-top:12px}


/* ---- language switcher ---- */
.shell{width:100%;max-width:660px;display:flex;flex-direction:column;gap:20px}
.lang-switch{
  display:flex;justify-content:center;gap:4px;align-self:center;
  padding:5px;background:var(--card);border:1px solid var(--border);border-radius:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.lang-btn{
  font-family:var(--font);font-size:.8rem;font-weight:700;letter-spacing:.06em;
  min-width:46px;padding:7px 14px;border:none;border-radius:16px;
  background:transparent;color:var(--muted);cursor:pointer;
  transition:background .15s ease,color .15s ease,box-shadow .15s ease;
}
.lang-btn:hover:not(.active){background:var(--purple-light);color:var(--purple)}
.lang-btn.active{background:var(--purple);color:#fff;cursor:default;box-shadow:0 3px 10px var(--purple-glow)}
.lang-btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---- responsive ---- */
@media(max-width:480px){
  .card{padding:24px 18px}
  .question{font-size:1rem}
  .opt{padding:12px 14px;font-size:.9rem}
  .btn{padding:11px 24px;font-size:.9rem}
}
</style>
</head>

</div>

      },
      {
        "q": "Was macht das Objekt <code>chat<\/code>, das mit <code>client.chats.create()<\/code> erstellt wurde?",

          "Erstellt ein neues KI-Modell auf unserem Computer",
          "Speichert den Gesprächsverlauf und sendet ihn mit jeder Frage",
          "Verschlüsselt Nachrichten vor dem Senden"
        ]
      },
      {
        "q": "Was passiert, wenn wir eine Frage mit einem falschen API-Schlüssel senden und kein <code>try/except<\/code> haben?",
        "o": [
          "Das Programm zeigt eine leere Antwort an",
          "Das Programm zeigt eine Warnung an und läuft weiter",
          "Das Programm friert ein und hört auf zu funktionieren (Absturz)",
          "Gemini repariert den Schlüssel automatisch"
        ]
      },
      {
        "q": "Was ist ein System-Prompt?",
        "o": [
          "Die erste Frage, die der Benutzer stellt",
          "Eine Anweisung, die dem Modell sagt, wie es sich verhalten soll (Ton, Stil, Persönlichkeit)",
          "Ein Befehl, der die Bibliothek installiert",
          "Eine Nachricht, die das Modell zu Beginn sendet"
        ]
      },
      {

        "o": [

          "Weil if in Python mit Text nicht funktioniert",
          "Weil ein Dictionary lesbarer ist und sich leichter um neue Figuren erweitern lässt",
          "Weil die Gemini API ein Dictionary verlangt"
        ]
      },
      {
        "q": "Welchen Nachteil hat die Nutzung eines KI-Modells über eine API im Vergleich zu einem lokalen Modell?",
        "o": [

          "Die API erfordert Internet, einen Schlüssel und Vertrauen in den Anbieter",

const LANGS=['pl','en','es','de'];
let lang='pl';
const UI=()=>I18N[lang].ui;
const QS=()=>I18N[lang].questions;
const fmt=(s,v)=>s.replace(/\{(\w+)\}/g,(_,k)=>v[k]);
const N=CORRECT.length;

const letters="ABCD";
let cur=0,sel=null,locked=false,score=0;

function render(){
  const app=document.getElementById("app");
  const ui=UI();
  if(cur>=N){
    const pct=Math.round(score/N*100);
    const emoji=pct>=80?"🎉":pct>=50?"👍":"💪";
    const msg=pct>=80?ui.msgHigh:pct>=50?ui.msgMid:ui.msgLow;
    app.innerHTML=`
      <div class="header"><span class="header-title">${ui.header}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
      <div class="card result">
        <div class="result-emoji">${emoji}</div>
        <div class="result-score">${score} / ${N}</div>
        <div class="result-pct">${pct}%</div>
        <div class="result-msg">${msg}</div>
        <button class="btn btn-primary" onclick="restart()">${ui.retry}</button>
      </div>`;
    return;
  }
  const q=QS()[cur];
  const c=CORRECT[cur];
  const pct=((cur+(locked?1:0))/N*100).toFixed(1);

  let optsHtml="";
  q.o.forEach((o,i)=>{
    let cls="opt";
    if(locked){
      cls+=" locked";
      if(i===c) cls+=" correct";
      else if(i===sel) cls+=" wrong";
      else cls+=" dimmed";
    } else if(i===sel){
      cls+=" selected";
    }
    optsHtml+=`<button class="${cls}" onclick="pick(${i})"><span class="letter">${letters[i]}</span><span class="opt-text">${o}</span></button>`;
  });

  let fbHtml="";
  if(locked){
    fbHtml=sel===c
      ?`<div class="feedback ok">${ui.fbOk}</div>`
      :`<div class="feedback nope">${ui.fbNo}</div>`;
  }

  const btnLabel=locked?(cur+1>=N?ui.seeResult:ui.next):ui.check;
  const btnAction=locked?"next()":"confirm()";
  const btnDis=!locked&&sel===null?"disabled":"";

  app.innerHTML=`
    <div class="header">
      <span class="header-title">${ui.header}</span>
      <span class="header-counter">${cur+1} / ${N}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card" key="${cur}">
      <p class="question">${q.q}</p>
      <div class="options">${optsHtml}</div>
      ${fbHtml}
      <div class="btn-row"><button class="btn btn-primary" onclick="${btnAction}" ${btnDis}>${btnLabel}</button></div>
    </div>
    <div class="score-pill">${fmt(ui.score,{s:score,n:cur+(locked?1:0)})}</div>`;
}

function pick(i){if(!locked){sel=i;render()}}
function confirm(){if(sel===null)return;locked=true;if(sel===CORRECT[cur])score++;render()}
function next(){cur++;sel=null;locked=false;render()}
function restart(){cur=0;sel=null;locked=false;score=0;render()}

// ---- language switching (quiz state is kept; only texts change) ----
function setLang(l,persist=true){
  if(!LANGS.includes(l)) l='pl';
  lang=l;
  document.documentElement.lang=l;
  document.title=UI().title;
  document.querySelectorAll('.lang-btn').forEach(b=>{
    const on=b.dataset.lang===l;
    b.classList.toggle('active',on);
    b.setAttribute('aria-pressed',on?'true':'false');
  });
  if(persist){try{localStorage.setItem('quizLang',l)}catch(e){/* storage unavailable */}}
  render();
}

document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

let startLang='pl';
try{const saved=localStorage.getItem('quizLang');if(LANGS.includes(saved))startLang=saved}catch(e){/* storage unavailable */}
setLang(startLang,false);
</script>
