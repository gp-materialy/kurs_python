<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Transformers: inteligentny chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F58220;
    --orange-light: #F8E2CB;
    --orange-glow: rgba(245, 130, 32, 0.15);
    --purple: #6F499D;
    --purple-light: #D4CFE5;
    --purple-glow: rgba(111, 73, 157, 0.12);
    --dark: #2D2D2D;
    --gray: #F5F5F5;
    --white: #FFFFFF;
    --green: #2ECC71;
    --red: #E74C3C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--gray);
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-pattern {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, var(--orange-glow), transparent),
      radial-gradient(ellipse 60% 80% at 90% 80%, var(--purple-glow), transparent);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  /* ─── Header ─── */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease-out;
  }

  .header-tag {
    display: inline-block;
    background: var(--purple);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 800;
    line-height: 1.15;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .header h1 span { color: var(--orange); }

  .header p {
    font-size: 15px;
    color: #777;
    font-weight: 400;
  }

  /* ─── Progress ─── */
  .progress-wrap {
    background: var(--white);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    animation: fadeDown 0.6s ease-out 0.1s both;
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-label {
    font-size: 13px;
    font-weight: 600;
    color: #999;
  }

  .progress-score {
    font-size: 13px;
    font-weight: 700;
    color: var(--purple);
  }

  .progress-bar {
    height: 8px;
    background: var(--gray);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--orange), var(--purple));
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ─── Question Card ─── */
  .question-card {
    background: var(--white);
    border-radius: 20px;
    padding: 32px 28px;
    margin-bottom: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    animation: fadeUp 0.5s ease-out;
    border: 2px solid transparent;
    transition: border-color 0.3s;
  }

  .question-card.correct { border-color: var(--green); }
  .question-card.wrong { border-color: var(--red); }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--orange);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 24px;
    color: var(--dark);
  }

  .q-text code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    background: var(--orange-light);
    color: var(--dark);
    padding: 2px 7px;
    border-radius: 6px;
  }

  /* ─── Options ─── */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 2px solid #E8E8E8;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--white);
    user-select: none;
  }

  .option:hover:not(.disabled) {
    border-color: var(--purple-light);
    background: var(--purple-glow);
    transform: translateY(-1px);
  }

  .option.disabled { cursor: default; opacity: 0.65; }
  .option.selected { border-color: var(--purple); background: var(--purple-glow); opacity: 1; }
  .option.is-correct { border-color: var(--green); background: rgba(46,204,113,0.08); opacity: 1; }
  .option.is-wrong { border-color: var(--red); background: rgba(231,76,60,0.06); opacity: 1; }

  .option-letter {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--gray);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: #999;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option.selected .option-letter { background: var(--purple); color: white; }
  .option.is-correct .option-letter { background: var(--green); color: white; }
  .option.is-wrong .option-letter { background: var(--red); color: white; }

  .option-text {
    font-size: 15px;
    line-height: 1.45;
    color: var(--dark);
  }

  .option-text code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--orange-light);
    padding: 1px 5px;
    border-radius: 4px;
  }

  /* ─── Feedback ─── */
  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    font-weight: 500;
    animation: fadeUp 0.3s ease-out;
  }

  .feedback.correct-fb {
    background: rgba(46,204,113,0.08);
    color: #1a8a4a;
    border-left: 4px solid var(--green);
  }

  .feedback.wrong-fb {
    background: rgba(231,76,60,0.06);
    color: #c0392b;
    border-left: 4px solid var(--red);
  }

  /* ─── Results ─── */
  .results {
    background: var(--white);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    animation: fadeUp 0.6s ease-out;
    display: none;
  }

  .results-icon {
    font-size: 56px;
    margin-bottom: 16px;
  }

  .results h2 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .results-score {
    font-size: 48px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--orange), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 16px 0;
  }

  .results p { font-size: 15px; color: #777; margin-bottom: 24px; }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--orange), var(--purple));
    color: white;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(245,130,32,0.3);
  }

  /* ─── Animations ─── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .pop { animation: pop 0.3s ease-out; }

  /* ─── Language switcher ─── */
  .lang-switch {
    display: flex;
    justify-content: center;
    gap: 4px;
    width: fit-content;
    margin: 0 auto 28px;
    padding: 5px;
    background: var(--white);
    border-radius: 100px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    animation: fadeDown 0.6s ease-out;
  }

  .lang-btn {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    min-width: 48px;
    padding: 8px 14px;
    border: none;
    border-radius: 100px;
    background: transparent;
    color: #777;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s;
  }

  .lang-btn:hover:not(.active) { background: var(--purple-glow); color: var(--purple); }

  .lang-btn.active {
    background: linear-gradient(135deg, var(--orange), var(--purple));
    color: white;
    box-shadow: 0 4px 12px rgba(245,130,32,0.25);
    cursor: default;
  }

  .lang-btn:focus-visible { outline: 3px solid var(--purple-light); outline-offset: 2px; }

  /* no entrance animation when the card is only re-rendered (language change) */
  .question-card.no-anim, .feedback.no-anim { animation: none; }
</style>
</head>

</div>

const LANGS = ['pl', 'en', 'es', 'de'];
const TOTAL = CORRECT.length;
let lang = 'pl';
const T  = () => I18N[lang].ui;
const QS = () => I18N[lang].questions;
const fmt = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);

// ─── Quiz state ───
let currentQ = 0;
let score = 0;
let answered = new Array(TOTAL).fill(false);
let chosen = new Array(TOTAL).fill(null);   // index of the option picked for each question
let finished = false;

function renderQuestion(animate = true) {
  const area = document.getElementById('quizArea');
  const q = QS()[currentQ];
  const letters = ['A', 'B', 'C', 'D'];

  let html = `<div class="question-card${animate ? '' : ' no-anim'}" id="qCard">
    <div class="q-number">${fmt(T().qNum, { n: currentQ + 1, total: TOTAL })}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">`;

  q.options.forEach((opt, i) => {
    html += `<div class="option" data-idx="${i}" onclick="selectOption(${i})">
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt}</div>
    </div>`;
  });

  html += `</div><div id="feedback"></div></div>`;
  area.innerHTML = html;

  // if this question was already answered (e.g. the language was changed), restore its state
  if (answered[currentQ]) showAnswerState(false);

  updateProgress();
}

function showAnswerState(pop) {
  const q = QS()[currentQ];
  const idx = chosen[currentQ];
  const isCorrect = idx === CORRECT[currentQ];
  const card = document.getElementById('qCard');
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');

  options.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === CORRECT[currentQ]) opt.classList.add('is-correct');
    if (i === idx && !isCorrect) opt.classList.add('is-wrong');
    if (i === idx) opt.classList.add('selected');
  });

  card.classList.add(isCorrect ? 'correct' : 'wrong');
  if (pop) card.classList.add('pop');

  feedback.innerHTML = `<div class="feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'}${pop ? '' : ' no-anim'}">
    ${isCorrect ? '✓' : '✗'} ${q.explain}
  </div>`;
}

function selectOption(idx) {
  if (answered[currentQ]) return;
  answered[currentQ] = true;
  chosen[currentQ] = idx;

  if (idx === CORRECT[currentQ]) score++;

  showAnswerState(true);
  updateProgress();

  setTimeout(() => {
    if (currentQ < TOTAL - 1) {
      currentQ++;
      renderQuestion();
      window.scrollTo({ top: document.getElementById('qCard').offsetTop - 120, behavior: 'smooth' });
    } else {
      showResults();
    }
  }, 1800);
}

function updateProgress() {
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('progressLabel').textContent = answered[currentQ]
    ? fmt(T().answeredOf, { n: answeredCount, total: TOTAL })
    : fmt(T().qOf, { n: currentQ + 1, total: TOTAL });
  document.getElementById('progressScore').textContent = `${score} / ${TOTAL}`;
  document.getElementById('progressFill').style.width = `${(answeredCount / TOTAL) * 100}%`;
}

function renderResults() {
  const pct = Math.round((score / TOTAL) * 100);
  const ui = T();
  let icon, tier;

  if (pct >= 90)      { icon = '🏆'; tier = ui.r90; }
  else if (pct >= 70) { icon = '🎯'; tier = ui.r70; }
  else if (pct >= 50) { icon = '💪'; tier = ui.r50; }
  else                { icon = '📖'; tier = ui.r0; }

  document.getElementById('resultsIcon').textContent = icon;
  document.getElementById('resultsTitle').textContent = tier[0];
  document.getElementById('resultsScore').textContent = `${score} / ${TOTAL}`;
  document.getElementById('resultsText').textContent = tier[1];
}

function showResults() {
  finished = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  renderResults();
}

function restartQuiz() {
  currentQ = 0;
  score = 0;
  answered = new Array(TOTAL).fill(false);
  chosen = new Array(TOTAL).fill(null);
  finished = false;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Language switching ───
function applyLanguage(l, persist = true) {
  if (!LANGS.includes(l)) l = 'pl';
  lang = l;
  const ui = T();

  document.documentElement.lang = l;
  document.title = ui.title;
  document.getElementById('headerTag').textContent = ui.tag;
  document.getElementById('headerTitle').innerHTML = ui.h1;
  document.getElementById('headerSub').textContent = ui.sub;
  document.getElementById('btnRestart').textContent = ui.retry;

  document.querySelectorAll('.lang-btn').forEach(btn => {
    const active = btn.dataset.lang === l;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });

  if (persist) {
    try { localStorage.setItem('quizLang', l); } catch (e) { /* storage unavailable */ }
  }

  // re-render what is on screen, keeping score / current question / given answers
  if (!finished) renderQuestion(false);
  else renderResults();
  updateProgress();
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});

let startLang = 'pl';
try {
  const saved = localStorage.getItem('quizLang');
  if (LANGS.includes(saved)) startLang = saved;
} catch (e) { /* storage unavailable */ }

applyLanguage(startLang, false);
</script>
