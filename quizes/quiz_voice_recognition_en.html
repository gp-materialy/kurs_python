<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Voice Recognition</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; font-family: 'DM Sans', 'Segoe UI', sans-serif; padding: 40px 20px; min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 48px; }
  .badge { display: inline-block; background: linear-gradient(135deg, #f97316, #fb923c); border-radius: 12px; padding: 8px 20px; margin-bottom: 16px; font-size: 13px; font-weight: 700; color: #0a0a0f; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { color: #f1f1f4; font-size: 28px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
  .sub { color: #71717a; font-size: 15px; }
  .card { background: #141419; border: 1px solid #27272a; border-radius: 16px; padding: 28px; margin-bottom: 16px; transition: border-color 0.3s; }
  .card.correct { border-color: #22c55e40; }
  .card.wrong { border-color: #ef444440; }
  .q-row { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 20px; }
  .q-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; color: #f97316; background: #f9731615; border-radius: 8px; padding: 4px 10px; flex-shrink: 0; }
  .q-text { color: #e4e4e7; font-size: 15px; font-weight: 500; line-height: 1.55; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0; }
  .opts.has-action { margin-bottom: 16px; }
  .opt { display: flex; align-items: center; gap: 10px; background: #1c1c22; border: 1px solid #27272a; border-radius: 10px; padding: 10px 14px; cursor: pointer; text-align: left; transition: all 0.2s; font-family: inherit; font-size: 14px; width: 100%; }
  .opt:hover:not(.locked) { border-color: #3f3f46; }
  .opt .letter { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: #a1a1aa; opacity: 0.7; flex-shrink: 0; }
  .opt .label { color: #a1a1aa; line-height: 1.45; }
  .opt.selected { background: #f9731620; border-color: #f97316; }
  .opt.selected .letter, .opt.selected .label { color: #fb923c; }
  .opt.reveal-correct { background: #22c55e15; border-color: #22c55e60; }
  .opt.reveal-correct .letter, .opt.reveal-correct .label { color: #4ade80; }
  .opt.reveal-wrong { background: #ef444415; border-color: #ef444460; }
  .opt.reveal-wrong .letter, .opt.reveal-wrong .label { color: #f87171; }
  .opt.locked { cursor: default; }
  .btn-check { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; border: none; border-radius: 8px; padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .feedback { font-size: 13px; font-weight: 600; }
  .feedback.ok { color: #4ade80; }
  .feedback.nope { color: #f87171; }
  .summary { text-align: center; background: #141419; border: 1px solid #27272a; border-radius: 16px; padding: 32px; margin-top: 8px; }
  .score { font-size: 48px; font-weight: 700; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
  .score.high { background-image: linear-gradient(135deg, #4ade80, #22c55e); }
  .score.mid { background-image: linear-gradient(135deg, #fb923c, #f97316); }
  .score.low { background-image: linear-gradient(135deg, #f87171, #ef4444); }
  .summary p { color: #a1a1aa; font-size: 15px; margin-bottom: 20px; }
  .btn-reset { background: #1c1c22; color: #a1a1aa; border: 1px solid #27272a; border-radius: 8px; padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  @media (max-width: 600px) { .opts { grid-template-columns: 1fr; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="badge">Review quiz</div>
    <h1>Voice recognition - virtual scribe</h1>
    <p class="sub">10 questions · choose an answer and click “Check”</p>
  </div>
  <div id="quiz"></div>
  <div id="summary" style="display:none"></div>
</div>
<script>
const QS = [
  { q: "Which library do we use to record audio from the microphone in our project?", o: ["SpeechRecognition", "scipy", "sounddevice", "numpy"], c: 2 },
  { q: "What does the value SAMPLE_RATE = 44100 mean?", o: ["The maximum file size in bytes", "The number of sound measurements per second", "The recording time in milliseconds", "The number of audio channels"], c: 1 },
  { q: "Why do we multiply the audio data by 32767 before saving it to WAV?", o: ["To make the file smaller", "To make the sound louder", "To convert floating-point numbers to the 16-bit PCM format", "To remove noise from the recording"], c: 2 },
  { q: "Which parameter of the recognize_google() method do we set to \"en-US\"?", o: ["encoding", "format", "language", "dialect"], c: 2 },
  { q: "What does the lower() method do when called on the text in the process_commands function?", o: ["It removes spaces from the text", "It converts the whole text to lowercase", "It cuts the text down to 100 characters", "It converts digits into words"], c: 1 },
  { q: "Which exception do we catch when Google does not recognize the speech?", o: ["sr.AudioError", "sr.TimeoutError", "sr.RequestError", "sr.UnknownValueError"], c: 3 },
  { q: "What does the voice command \"new line\" do?", o: ["It ends the dictation", "It inserts a new paragraph (a newline character)", "It inserts a period", "It deletes the last sentence"], c: 1 },
  { q: "Why do we check for the \"stop\" command BEFORE calling process_commands?", o: ["To make the program run faster", "Because process_commands could replace or remove the word \"stop\"", "Because \"stop\" is a reserved word in Python", "So that the word \"stop\" is not saved to the file"], c: 1 },
  { q: "How do we filter the list of devices to display only microphones?", o: ["We check whether the name contains the word \"microphone\"", "We check whether max_output_channels > 0", "We check whether max_input_channels > 0", "We check whether the device is connected via USB"], c: 2 },
  { q: "Which encoding do we specify when saving the note to a text file?", o: ["ascii", "utf-8", "latin-1", "windows-1252"], c: 1 }
];
const L = ["A","B","C","D"];
const answers = {}, revealed = {};
let totalRevealed = 0;

function render() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  QS.forEach((item, qi) => {
    const picked = answers[qi];
    const isRev = revealed[qi];
    const isOk = picked === item.c;
    const card = document.createElement("div");
    card.className = "card" + (isRev ? (isOk ? " correct" : " wrong") : "");

    let optsHtml = "";
    item.o.forEach((opt, oi) => {
      let cls = "opt";
      if (isRev) {
        cls += " locked";
        if (oi === item.c) cls += " reveal-correct";
        else if (oi === picked) cls += " reveal-wrong";
      } else if (picked === oi) {
        cls += " selected";
      }
      optsHtml += `<button class="${cls}" data-qi="${qi}" data-oi="${oi}"><span class="letter">${L[oi]}</span><span class="label">${opt}</span></button>`;
    });

    let action = "";
    if (picked !== undefined && !isRev) action = `<button class="btn-check" data-qi="${qi}">Check</button>`;
    if (isRev) action = `<div class="feedback ${isOk ? "ok" : "nope"}">${isOk ? "✓ Correct answer!" : "✗ Correct answer: " + L[item.c]}</div>`;

    card.innerHTML = `<div class="q-row"><span class="q-num">${qi+1}</span><p class="q-text">${item.q}</p></div><div class="opts${(picked !== undefined) ? " has-action" : ""}">${optsHtml}</div>${action}`;
    quiz.appendChild(card);
  });

  quiz.querySelectorAll(".opt:not(.locked)").forEach(btn => {
    btn.addEventListener("click", () => {
      const qi = +btn.dataset.qi, oi = +btn.dataset.oi;
      if (revealed[qi]) return;
      answers[qi] = oi;
      render();
    });
  });
  quiz.querySelectorAll(".btn-check").forEach(btn => {
    btn.addEventListener("click", () => {
      const qi = +btn.dataset.qi;
      revealed[qi] = true;
      totalRevealed++;
      render();
      if (totalRevealed === QS.length) showSummary();
    });
  });
}

function showSummary() {
  let correct = 0;
  QS.forEach((_, qi) => { if (answers[qi] === QS[qi].c) correct++; });
  const cls = correct >= 8 ? "high" : correct >= 5 ? "mid" : "low";
  const msg = correct === 10 ? "Perfect! Everything is clear." : correct >= 8 ? "Great score!" : correct >= 5 ? "Not bad, but it’s worth reviewing a few things." : "It’s worth going back to the material and trying again.";
  const el = document.getElementById("summary");
  el.style.display = "block";
  el.innerHTML = `<div class="summary"><div class="score ${cls}">${correct}/${QS.length}</div><p>${msg}</p><button class="btn-reset" onclick="resetQuiz()">Try again</button></div>`;
}

function resetQuiz() {
  Object.keys(answers).forEach(k => delete answers[k]);
  Object.keys(revealed).forEach(k => delete revealed[k]);
  totalRevealed = 0;
  document.getElementById("summary").style.display = "none";
  render();
}

render();
</script>
</body>
</html>
