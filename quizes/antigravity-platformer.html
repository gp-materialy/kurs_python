<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Vibe kodujemy Platformera</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F58220;
    --orange-light: #F8E2CB;
    --orange-glow: rgba(245,130,32,.15);
    --purple: #6F499D;
    --purple-light: #D4CFE5;
    --purple-glow: rgba(111,73,157,.12);
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --text: #2D2D2D;
    --text-muted: #777;
    --correct: #2ECC71;
    --correct-bg: #EAFAF1;
    --wrong: #E74C3C;
    --wrong-bg: #FDEDEC;
    --radius: 14px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(100px);
    opacity: .35;
  }
  body::before {
    width: 500px; height: 500px;
    background: var(--orange);
    top: -180px; right: -120px;
  }
  body::after {
    width: 420px; height: 420px;
    background: var(--purple);
    bottom: -140px; left: -100px;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header .pill {
    display: inline-block;
    background: var(--purple);
    color: #fff;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 16px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .header h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 800;
    line-height: 1.2;
    color: var(--text);
  }
  .header h1 span { color: var(--orange); }
  .header p {
    margin-top: 8px;
    color: var(--text-muted);
    font-size: .95rem;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .progress-track {
    flex: 1;
    height: 10px;
    background: #E8E8E8;
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--orange));
    border-radius: 100px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: .85rem;
    font-weight: 700;
    color: var(--purple);
    min-width: 48px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    padding: 28px 26px 24px;
    margin-bottom: 20px;
    border: 2px solid transparent;
    transition: border-color .3s, box-shadow .3s;
    display: none;
  }
  .q-card.active { display: block; animation: fadeUp .4s ease; }
  .q-card.answered-correct { border-color: var(--correct); box-shadow: 0 0 0 4px var(--correct-bg); }
  .q-card.answered-wrong   { border-color: var(--wrong);   box-shadow: 0 0 0 4px var(--wrong-bg); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: .75rem;
    font-weight: 600;
    color: var(--orange);
    margin-bottom: 6px;
    letter-spacing: .04em;
  }
  .q-text {
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 20px;
  }

  .opts { display: flex; flex-direction: column; gap: 10px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid #E8E8E8;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .opt:hover:not(.locked) {
    border-color: var(--purple);
    background: var(--purple-glow);
  }
  .opt.locked { cursor: default; }

  .opt .letter {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 8px;
    background: #F0F0F0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: .82rem;
    color: var(--text);
    transition: all .25s;
  }
  .opt .opt-text {
    font-size: .95rem;
    line-height: 1.4;
    padding-top: 3px;
  }

  .opt.is-correct .letter { background: var(--correct); color: #fff; }
  .opt.is-wrong   .letter { background: var(--wrong);   color: #fff; }
  .opt.is-correct { border-color: var(--correct); background: var(--correct-bg); }
  .opt.is-wrong   { border-color: var(--wrong);   background: var(--wrong-bg); }
  .opt.reveal-correct { border-color: var(--correct); background: var(--correct-bg); }
  .opt.reveal-correct .letter { background: var(--correct); color: #fff; }

  .feedback {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: .9rem;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; animation: fadeUp .3s ease; }
  .feedback.ok  { background: var(--correct-bg); color: #1B7A3D; }
  .feedback.nok { background: var(--wrong-bg);   color: #B03A2E; }
  .feedback strong { font-weight: 700; }

  .nav-btn {
    display: none;
    margin: 0 auto;
    padding: 14px 40px;
    border: none;
    border-radius: 100px;
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--purple), var(--orange));
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 4px 18px rgba(245,130,32,.3);
  }
  .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245,130,32,.4); }
  .nav-btn.show { display: block; animation: fadeUp .35s ease; }

  .results {
    display: none;
    text-align: center;
    animation: fadeUp .5s ease;
  }
  .results.show { display: block; }
  .results .emoji { font-size: 3.5rem; margin-bottom: 10px; }
  .results h2 {
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .results h2 span { color: var(--orange); }
  .results .sub { color: var(--text-muted); font-size: 1rem; margin-bottom: 28px; }

  .score-ring-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }
  .score-ring {
    position: relative;
    width: 150px; height: 150px;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .bg-circle  { fill: none; stroke: #E8E8E8; stroke-width: 10; }
  .score-ring .fg-circle  { fill: none; stroke: url(#grad); stroke-width: 10; stroke-linecap: round;
    stroke-dasharray: 408; stroke-dashoffset: 408; transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1); }
  .score-ring .score-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 800; color: var(--purple);
  }

  .restart-btn {
    display: inline-block;
    padding: 14px 40px;
    border: 2px solid var(--purple);
    border-radius: 100px;
    font-family: 'Outfit', sans-serif;
    font-size: .95rem;
    font-weight: 700;
    color: var(--purple);
    background: transparent;
    cursor: pointer;
    transition: all .2s;
  }
  .restart-btn:hover { background: var(--purple); color: #fff; }

  .kbd-hint {
    text-align: center;
    margin-top: 12px;
    font-size: .78rem;
    color: var(--text-muted);
  }
  .kbd-hint kbd {
    display: inline-block;
    padding: 1px 7px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f4f4f4;
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="pill">Giganci Programowania</div>
    <h1>Quiz: <span>Vibe kodujemy Platformera</span></h1>
    <p>Sprawdź, ile zapamiętałeś z dzisiejszej lekcji!</p>
  </div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="bar"></div></div>
    <div class="progress-label" id="counter">0 / 12</div>
  </div>

  <div id="quiz"></div>

  <button class="nav-btn" id="nextBtn" onclick="nextQ()">Następne pytanie →</button>

  <div class="results" id="results">
    <div class="emoji" id="resEmoji"></div>
    <h2 id="resTitle"></h2>
    <p class="sub" id="resSub"></p>
    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg viewBox="0 0 150 150" width="150" height="150">
          <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6F499D"/><stop offset="100%" stop-color="#F58220"/>
          </linearGradient></defs>
          <circle class="bg-circle"  cx="75" cy="75" r="65"/>
          <circle class="fg-circle" id="ring" cx="75" cy="75" r="65"/>
        </svg>
        <div class="score-text" id="scoreText">0%</div>
      </div>
    </div>
    <button class="restart-btn" onclick="restart()">Spróbuj ponownie</button>
  </div>

  <div class="kbd-hint" id="kbdHint">Skrót: <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> wybierają odpowiedź, <kbd>Enter</kbd> przechodzi dalej</div>
</div>

<script>
var DATA = [
  {
    q: "Jaki jest prawidłowy cykl pracy z Antigravity?",
    opts: [
      "Wygeneruj \u2192 przetestuj \u2192 opisz \u2192 zapytaj chatbota",
      "Opisz \u2192 wygeneruj \u2192 zapytaj chatbota \u2192 przetestuj \u2192 iteruj",
      "Zapytaj chatbota \u2192 opisz \u2192 wygeneruj \u2192 przetestuj",
      "Przetestuj \u2192 opisz \u2192 wygeneruj \u2192 iteruj"
    ],
    ans: 1,
    info: "Cykl zaczyna si\u0119 od opisania, czego potrzebujemy, a ko\u0144czy iterowaniem \u2013 poprawiamy tak d\u0142ugo, a\u017c wynik nas zadowoli."
  },
  {
    q: "Na czym polega idea pikselowej mapy poziomu?",
    opts: [
      "Mapa jest generowana losowo przy ka\u017cdym uruchomieniu gry",
      "Mapa opisuje poziom za pomoc\u0105 tekstu w pliku JSON",
      "Mapa to du\u017cy obrazek wy\u015bwietlany bezpo\u015brednio jako t\u0142o gry",
      "Ka\u017cdy piksel ma\u0142ego obrazka odpowiada kafelkowi na ekranie, a jego kolor okre\u015bla typ elementu gry"
    ],
    ans: 3,
    info: "Ma\u0142y obrazek PNG s\u0142u\u017cy jako \u201eprzepis\u201d na poziom \u2013 program odczytuje kolor ka\u017cdego piksela i tworzy odpowiedni element gry w odpowiednim miejscu."
  },
  {
    q: "Co oznacza zielony piksel (#00FF00) na pikselowej mapie poziomu?",
    opts: [
      "Platforma / pod\u0142o\u017ce",
      "Punkt startu gracza",
      "Przedmiot do zebrania",
      "Ruchoma przeszkoda"
    ],
    ans: 0,
    info: "Zielony to platforma lub pod\u0142o\u017ce \u2013 podstawowy element, po kt\u00f3rym gracz chodzi i skacze."
  },
  {
    q: "Co uczniowie powinni zrobi\u0107 zaraz po tym, jak Antigravity wygeneruje nowy fragment kodu?",
    opts: [
      "Od razu pisa\u0107 nast\u0119pny prompt",
      "Skopiowa\u0107 kod do osobnego pliku",
      "U\u017cy\u0107 chatbota w Antigravity, \u017ceby zapyta\u0107 o wyja\u015bnienie dzia\u0142ania kodu",
      "Usun\u0105\u0107 komentarze z kodu"
    ],
    ans: 2,
    info: "Rozmowa z chatbotem o wygenerowanym kodzie to kluczowy moment nauki \u2013 dzi\u0119ki temu uczniowie rozumiej\u0105, co robi kod, a nie tylko go kopiuj\u0105."
  },
  {
    q: "Co oznacza bia\u0142y piksel (#FFFFFF) na pikselowej mapie poziomu?",
    opts: [
      "Puste powietrze",
      "Platforma",
      "Power-up",
      "Meta \u2013 koniec poziomu"
    ],
    ans: 3,
    info: "Bia\u0142y piksel to meta. Dotarcie do niej oznacza, \u017ce gracz przeszed\u0142 poziom."
  },
  {
    q: "Dlaczego wa\u017cne jest precyzyjne opisanie fizyki (grawitacji, kolizji) w prompcie dla Antigravity?",
    opts: [
      "Bo AI nie domy\u015bli si\u0119 szczeg\u00f3\u0142\u00f3w mechanik i mo\u017ce wygenerowa\u0107 nieprzewidywalne zachowanie",
      "Bo pygame wymaga podania dok\u0142adnych warto\u015bci liczbowych przy instalacji",
      "Bo bez tego kod si\u0119 nie uruchomi",
      "Bo Antigravity ignoruje og\u00f3lnikowe opisy i zwraca pusty plik"
    ],
    ans: 0,
    info: "Im precyzyjniej opiszemy oczekiwane zachowanie (np. jak gracz l\u0105duje na platformie), tym lepszy kod wygeneruje AI. Og\u00f3lnikowy prompt daje nieprzewidywalne rezultaty."
  },
  {
    q: "Dlaczego w pierwszym prompcie prosimy o podzia\u0142 kodu na klasy (np. Player, Game, Level)?",
    opts: [
      "Bo pygame nie dzia\u0142a bez klas",
      "Bo Antigravity generuje kod wy\u0142\u0105cznie w klasach",
      "\u017beby kod by\u0142 uporz\u0105dkowany i \u0142atwiejszy do rozbudowy od pocz\u0105tku",
      "\u017beby gra dzia\u0142a\u0142a szybciej"
    ],
    ans: 2,
    info: "Enkapsulacja sprawia, \u017ce ka\u017cda klasa odpowiada za jedn\u0105 rzecz. Gdy projekt ro\u015bnie, \u0142atwiej znale\u017a\u0107 i naprawi\u0107 b\u0142\u0105d albo doda\u0107 now\u0105 funkcj\u0119."
  },
  {
    q: "Jakiej biblioteki Pythona u\u017cywamy do odczytywania kolor\u00f3w pikseli z pliku PNG?",
    opts: [
      "OpenCV",
      "PIL / Pillow",
      "NumPy",
      "pygame.image"
    ],
    ans: 1,
    info: "PIL/Pillow to popularna biblioteka do pracy z obrazami w Pythonie \u2013 pozwala \u0142atwo odczyta\u0107 kolor dowolnego piksela."
  },
  {
    q: "Co powinno si\u0119 wydarzy\u0107 w grze, gdy gracz dotrze do mety?",
    opts: [
      "Gra \u0142aduje kolejny poziom z nast\u0119pnej pikselowej mapy",
      "Gracz wraca na pocz\u0105tek tego samego poziomu",
      "Gra automatycznie si\u0119 zamyka",
      "Wy\u015bwietla si\u0119 reklama"
    ],
    ans: 0,
    info: "Meta to przej\u015bcie mi\u0119dzy poziomami \u2013 gra \u0142aduje nast\u0119pn\u0105 pikselow\u0105 map\u0119 i buduje z niej nowy uk\u0142ad platform, przeszk\u00f3d i przedmiot\u00f3w."
  },
  {
    q: "Dlaczego pikselowa mapa poziomu jest ma\u0142a, a nie ma rozmiaru ekranu gry?",
    opts: [
      "Bo du\u017ce obrazki nie dzia\u0142aj\u0105 w pygame",
      "Bo ma\u0142\u0105 map\u0119 \u0142atwiej narysowa\u0107 i edytowa\u0107, a program sam przeskaluje j\u0105 na ekran",
      "Bo PIL/Pillow obs\u0142uguje tylko ma\u0142e obrazki",
      "Bo Antigravity nie potrafi wygenerowa\u0107 kodu dla du\u017cych map"
    ],
    ans: 1,
    info: "Uczniowie mog\u0105 projektowa\u0107 poziomy nawet w Paincie \u2013 rysuj\u0105 ma\u0142y obrazek z kolorowych pikseli, a program automatycznie zamienia go na pe\u0142nowymiarowy poziom."
  },
  {
    q: "Dlaczego wa\u017cne jest, \u017ceby gracz l\u0105dowa\u0142 NA platformie, a nie zacina\u0142 si\u0119 w niej od boku?",
    opts: [
      "Bo gra si\u0119 wtedy zawiesi",
      "Bo gracz m\u00f3g\u0142by przechodzi\u0107 przez \u015bciany",
      "Bo blokowa\u0142oby to swobodny ruch i psu\u0142o rozgrywk\u0119",
      "Bo pygame nie obs\u0142uguje kolizji bocznych"
    ],
    ans: 2,
    info: "W grze platformowej gracz musi swobodnie skaka\u0107 obok i nad platformami. Zaci\u0119cie od boku blokowa\u0142oby ruch i frustrowa\u0142o graczy."
  },
  {
    q: "Jakiego narz\u0119dzia AI u\u017cyli\u015bmy do wygenerowania grafik (sprite'\u00f3w) do gry?",
    opts: [
      "ChatGPT",
      "Antigravity",
      "DALL-E",
      "Gemini"
    ],
    ans: 3,
    info: "Sprite'y wygenerowali\u015bmy w Gemini (generowanie obraz\u00f3w), a potem pod\u0142\u0105czyli\u015bmy je do gry za pomoc\u0105 promptu w Antigravity."
  }
];

var LETTERS = ['A','B','C','D'];
var cur = 0, score = 0, answered = false;

function buildQuiz() {
  var wrap = document.getElementById('quiz');
  wrap.innerHTML = '';
  DATA.forEach(function(d, i) {
    var card = document.createElement('div');
    card.className = 'q-card' + (i === 0 ? ' active' : '');
    card.id = 'q' + i;
    card.innerHTML =
      '<div class="q-num">Pytanie ' + (i+1) + ' z ' + DATA.length + '</div>' +
      '<div class="q-text">' + d.q + '</div>' +
      '<div class="opts">' + d.opts.map(function(o, j) {
        return '<div class="opt" data-idx="' + j + '" onclick="pick(' + i + ',' + j + ')">' +
          '<div class="letter">' + LETTERS[j] + '</div>' +
          '<div class="opt-text">' + o + '</div></div>';
      }).join('') + '</div>' +
      '<div class="feedback" id="fb' + i + '"></div>';
    wrap.appendChild(card);
  });
}

function pick(qi, oi) {
  if (answered) return;
  answered = true;
  var d = DATA[qi];
  var card = document.getElementById('q' + qi);
  var opts = card.querySelectorAll('.opt');
  opts.forEach(function(o) { o.classList.add('locked'); });

  var fb = document.getElementById('fb' + qi);

  if (oi === d.ans) {
    score++;
    opts[oi].classList.add('is-correct');
    card.classList.add('answered-correct');
    fb.className = 'feedback ok show';
    fb.innerHTML = '<strong>Brawo!</strong> ' + d.info;
  } else {
    opts[oi].classList.add('is-wrong');
    opts[d.ans].classList.add('reveal-correct');
    card.classList.add('answered-wrong');
    fb.className = 'feedback nok show';
    fb.innerHTML = '<strong>Nie tym razem.</strong> ' + d.info;
  }

  updateProgress();

  if (cur < DATA.length - 1) {
    document.getElementById('nextBtn').classList.add('show');
  } else {
    setTimeout(showResults, 600);
  }
}

function nextQ() {
  document.getElementById('q' + cur).classList.remove('active');
  cur++;
  answered = false;
  document.getElementById('q' + cur).classList.add('active');
  document.getElementById('nextBtn').classList.remove('show');
}

function updateProgress() {
  var pct = ((cur + 1) / DATA.length) * 100;
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + DATA.length;
}

function showResults() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('kbdHint').style.display = 'none';
  document.getElementById('bar').style.width = '100%';

  var pct = Math.round((score / DATA.length) * 100);
  var res = document.getElementById('results');
  res.classList.add('show');

  document.getElementById('scoreText').textContent = pct + '%';
  var circ = 2 * Math.PI * 65;
  document.getElementById('ring').style.strokeDashoffset = circ - (circ * pct / 100);

  if (pct >= 90) {
    document.getElementById('resEmoji').textContent = '\u{1F3C6}';
    document.getElementById('resTitle').innerHTML = 'Mistrzostwo! <span>' + score + '/' + DATA.length + '</span>';
    document.getElementById('resSub').textContent = 'Antigravity nie ma przed tob\u0105 tajemnic!';
  } else if (pct >= 60) {
    document.getElementById('resEmoji').textContent = '\u{1F3AE}';
    document.getElementById('resTitle').innerHTML = 'Dobra robota! <span>' + score + '/' + DATA.length + '</span>';
    document.getElementById('resSub').textContent = 'Jeszcze kilka iteracji i b\u0119dzie perfekcyjnie.';
  } else {
    document.getElementById('resEmoji').textContent = '\u{1F504}';
    document.getElementById('resTitle').innerHTML = 'Warto powt\u00f3rzy\u0107! <span>' + score + '/' + DATA.length + '</span>';
    document.getElementById('resSub').textContent = 'Przejrzyj konspekt i spr\u00f3buj ponownie.';
  }
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quiz').style.display = '';
  document.getElementById('kbdHint').style.display = '';
  document.getElementById('bar').style.width = '0%';
  document.getElementById('counter').textContent = '0 / ' + DATA.length;
  document.getElementById('ring').style.strokeDashoffset = 408;
  buildQuiz();
}

document.addEventListener('keydown', function(e) {
  var key = e.key.toLowerCase();
  if (!answered && 'abcd'.indexOf(key) !== -1) {
    pick(cur, 'abcd'.indexOf(key));
  }
  if (e.key === 'Enter' && answered && cur < DATA.length - 1) {
    nextQ();
  }
});

buildQuiz();
updateProgress();
</script>
</body>
</html>
