<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Copilot: pomocny programista AI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --surface-hover: #1c2333;
    --border: #30363d;
    --accent: #58a6ff;
    --accent-glow: rgba(88, 166, 255, 0.15);
    --green: #3fb950;
    --green-glow: rgba(63, 185, 80, 0.12);
    --red: #f85149;
    --red-glow: rgba(248, 81, 73, 0.12);
    --yellow: #d29922;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --code-bg: #0d1117;
    --font-display: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(88, 166, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88, 166, 255, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow--blue { background: #58a6ff; top: -200px; right: -100px; }
  .bg-glow--purple { background: #bc8cff; bottom: -200px; left: -100px; }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease-out both;
  }

  .header__badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .header__badge svg { flex-shrink: 0; }

  .header__title {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .header__sub {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.5;
  }

  /* ─── PROGRESS BAR ─── */
  .progress {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14, 17, 23, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
    margin: 0 -24px 36px;
    padding-inline: 24px;
    animation: fadeUp 0.6s 0.1s ease-out both;
  }

  .progress__inner {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 780px;
    margin: 0 auto;
  }

  .progress__bar {
    flex: 1;
    height: 6px;
    background: var(--surface);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress__fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a371f7);
    border-radius: 100px;
    width: 0%;
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .progress__label {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 48px;
    text-align: right;
  }

  /* ─── QUESTION CARD ─── */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s;
  }
  .question-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .question-card.correct {
    border-color: var(--green);
    box-shadow: 0 0 24px var(--green-glow);
  }
  .question-card.wrong {
    border-color: var(--red);
    box-shadow: 0 0 24px var(--red-glow);
  }

  .question-card__number {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .question-card__text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .question-card__code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 12px 0 20px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    overflow-x: auto;
    color: var(--text-muted);
    white-space: pre;
  }
  .question-card__code .kw { color: #ff7b72; }
  .question-card__code .fn { color: #d2a8ff; }
  .question-card__code .str { color: #a5d6ff; }
  .question-card__code .cm { color: #8b949e; font-style: italic; }
  .question-card__code .num { color: #79c0ff; }
  .question-card__code .op { color: #ff7b72; }

  .question-card__spacer { height: 12px; }

  /* ─── OPTIONS ─── */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .option:hover:not(.disabled) {
    background: var(--surface-hover);
    border-color: var(--accent);
  }

  .option__letter {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .option:hover:not(.disabled) .option__letter {
    border-color: var(--accent);
    color: var(--accent);
  }

  .option__text {
    font-size: 15px;
    line-height: 1.5;
    padding-top: 3px;
    text-align: left;
  }

  .option.selected-correct {
    background: var(--green-glow);
    border-color: var(--green);
  }
  .option.selected-correct .option__letter {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .option.selected-wrong {
    background: var(--red-glow);
    border-color: var(--red);
  }
  .option.selected-wrong .option__letter {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .option.reveal-correct {
    border-color: var(--green);
  }
  .option.reveal-correct .option__letter {
    border-color: var(--green);
    color: var(--green);
  }

  .option.disabled { cursor: default; pointer-events: none; }

  /* ─── EXPLANATION ─── */
  .explanation {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 10px;
    background: rgba(88, 166, 255, 0.06);
    border-left: 3px solid var(--accent);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
    display: none;
  }
  .explanation.show { display: block; animation: fadeUp 0.3s ease-out; }

  /* ─── RESULTS ─── */
  .results {
    text-align: center;
    padding: 48px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: none;
    animation: fadeUp 0.5s ease-out both;
  }
  .results.show { display: block; }

  .results__emoji { font-size: 56px; margin-bottom: 16px; }

  .results__score {
    font-size: 48px;
    font-weight: 800;
    font-family: var(--font-mono);
    background: linear-gradient(135deg, var(--green), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .results__label {
    font-size: 16px;
    color: var(--text-muted);
    margin-top: 4px;
    margin-bottom: 24px;
  }

  .results__message {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: rgba(88, 166, 255, 0.1);
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-restart:hover {
    background: rgba(88, 166, 255, 0.2);
    transform: translateY(-1px);
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease-out; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.3s ease-out; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .container { padding: 24px 16px 60px; }
    .question-card { padding: 20px; }
    .question-card__text { font-size: 15px; }
    .option { padding: 12px 14px; }
    .progress { margin: 0 -16px 28px; padding-inline: 16px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow--blue"></div>
<div class="bg-glow bg-glow--purple"></div>

<div class="container">
  <header class="header">
    <div class="header__badge">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 14.5a6.5 6.5 0 110-13 6.5 6.5 0 010 13zM7 4h2v5H7V4zm0 6h2v2H7v-2z" fill="currentColor"/></svg>
      QUIZ POWTÓRZENIOWY
    </div>
    <h1 class="header__title">Copilot - pomocny programista AI</h1>
    <p class="header__sub">12 pytań z lekcji o GitHub Copilot i grze Memory w pygame</p>
  </header>

  <div class="progress">
    <div class="progress__inner">
      <div class="progress__bar"><div class="progress__fill" id="progressFill"></div></div>
      <div class="progress__label" id="progressLabel">0 / 12</div>
    </div>
  </div>

  <div id="quizContainer"></div>

  <div class="results" id="results">
    <div class="results__emoji" id="resultsEmoji"></div>
    <div class="results__score" id="resultsScore"></div>
    <div class="results__label">poprawnych odpowiedzi</div>
    <div class="results__message" id="resultsMsg"></div>
    <button class="btn-restart" onclick="location.reload()">
      <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 019.3-3.95l-1.8.7a.5.5 0 00.18.96H14a.5.5 0 00.5-.5V1.38a.5.5 0 00-.96-.18l-.7 1.8A7 7 0 101 8a.75.75 0 011.5 0z" fill="currentColor"/></svg>
      Zagraj ponownie
    </button>
  </div>
</div>

<script>
"use strict";

const QUESTIONS = [
  {
    q: "Czym jest GitHub Copilot?",
    options: [
      "Rozszerzeniem do VS Code, które podpowiada kod na podstawie kontekstu projektu",
      "Osobną aplikacją desktopową do generowania całych programów",
      "Chatbotem działającym w przeglądarce, podobnym do ChatGPT",
      "Wtyczką do pygame, która automatycznie tworzy gry"
    ],
    correct: 0,
    explanation: "Copilot to rozszerzenie do edytora kodu (np. VS Code), które czyta otwarty plik, rozumie kontekst i w czasie rzeczywistym proponuje kolejne linie kodu."
  },
  {
    q: "Jak zaakceptować sugestię zaproponowaną przez Copilota w VS Code?",
    options: [
      "Kliknąć prawym przyciskiem myszy i wybrać \"Accept\"",
      "Nacisnąć Enter",
      "Nacisnąć Ctrl+S",
      "Nacisnąć Tab"
    ],
    correct: 3,
    explanation: "Klawisz Tab akceptuje sugestię Copilota. Jeśli chcemy ją odrzucić, naciskamy Esc."
  },
  {
    q: "Co zwraca funkcja <code>enumerate(board)</code> w pętli <code>for</code>?",
    options: [
      "Indeks elementu i sam element jednocześnie",
      "Tylko indeks każdego elementu listy",
      "Posortowaną kopię listy",
      "Liczbę elementów w liście"
    ],
    correct: 0,
    explanation: "Funkcja enumerate() w każdej iteracji zwraca krotkę (indeks, element). Dzięki temu mamy dostęp zarówno do numeru karty, jak i do jej danych."
  },
  {
    q: "Jaki stan przyjmuje karta po zebraniu pasującej pary?",
    options: [
      "\"collected\"",
      "\"hidden\"",
      "\"revealed\"",
      "\"matched\""
    ],
    correct: 3,
    explanation: "Stan \"matched\" oznacza, że karta została dopasowana do pary. Funkcja draw_single_card pomija karty z tym stanem, więc znikają z planszy."
  },
  {
    q: "Co sprawdza metoda <code>card[\"rect\"].collidepoint(pos)</code>?",
    options: [
      "Czy punkt pos (pozycja kursora) znajduje się wewnątrz prostokąta karty",
      "Czy karta koliduje z inną kartą na planszy",
      "Czy prostokąt karty dotyka krawędzi okna",
      "Czy animacja karty dobiegła końca"
    ],
    correct: 0,
    explanation: "Metoda collidepoint sprawdza, czy podany punkt (x, y) leży wewnątrz prostokąta Rect. Używamy jej do wykrycia, w którą kartę kliknął gracz."
  },
  {
    q: "Dlaczego w funkcji <code>handle_click</code> na końcu pętli jest instrukcja <code>break</code>?",
    code: '<span class="kw">for</span> i, card <span class="kw">in</span> <span class="fn">enumerate</span>(board):\n    <span class="kw">if</span> card[<span class="str">"rect"</span>].<span class="fn">collidepoint</span>(pos) <span class="kw">and</span> card[<span class="str">"state"</span>] == <span class="str">"hidden"</span>:\n        card[<span class="str">"state"</span>] = <span class="str">"revealing"</span>\n        selected.<span class="fn">append</span>(i)\n        <span class="kw">break</span>',
    options: [
      "Żeby pętla nie szukała kolejnych kart pasujących do tego samego kliknięcia",
      "Żeby program nie zgłosił błędu IndexError",
      "Żeby animacja karty rozpoczęła się natychmiast",
      "Jedno kliknięcie dotyczy dokładnie jednej karty, więc nie ma sensu kontynuować pętli"
    ],
    correct: 3,
    explanation: "Gracz klika w jedno miejsce i odkrywa jedną kartę. Po znalezieniu tej karty dalsza iteracja po liście jest zbędna - break kończy pętlę."
  },
  {
    q: "Co stanie się, jeśli w funkcji <code>check_pair</code> pominiemy wywołanie <code>selected.clear()</code>?",
    options: [
      "Lista selected będzie ciągle pełna i gracz nie będzie mógł klikać nowych kart",
      "Gra się zawiesi na ekranie ładowania",
      "Karty będą się odkrywać po trzy naraz",
      "Program zgłosi błąd TypeError przy następnym kliknięciu"
    ],
    correct: 0,
    explanation: "Główna pętla gry sprawdza warunek len(selected) < 2 przed wywołaniem handle_click. Bez wyczyszczenia listy warunek nigdy nie będzie spełniony i gracz nie odkryje kolejnych kart."
  },
  {
    q: "Do czego służy flaga <code>pygame.SRCALPHA</code> przy tworzeniu powierzchni ekranu wygranej?",
    options: [
      "Przyspiesza renderowanie grafiki na karcie graficznej",
      "Blokuje kliknięcia myszy na tej powierzchni",
      "Zmienia paletę kolorów na odcienie szarości",
      "Pozwala na półprzezroczystość - nakładka przyciemnia ekran, ale nie zakrywa go całkowicie"
    ],
    correct: 3,
    explanation: "SRCALPHA dodaje kanał alfa do powierzchni. Dzięki temu fill((0, 0, 0, 150)) tworzy czarną nakładkę z przezroczystością, przez którą prześwituje plansza."
  },
  {
    q: "Co zwraca wyrażenie <code>all(c[\"state\"] == \"matched\" for c in board)</code>?",
    options: [
      "True, gdy każda karta na planszy ma stan \"matched\"",
      "Liczbę kart ze stanem \"matched\"",
      "Listę kart, które mają stan \"matched\"",
      "True, gdy przynajmniej jedna karta ma stan \"matched\""
    ],
    correct: 0,
    explanation: "Funkcja all() zwraca True tylko wtedy, gdy każdy element spełnia podany warunek. Używamy jej do wykrycia wygranej - wszystkie 16 kart muszą być zebrane."
  },
  {
    q: "Dlaczego ważne jest krytyczne ocenianie sugestii Copilota zamiast ślepego akceptowania?",
    options: [
      "Bo Copilot celowo generuje błędny kod, żeby testować programistów",
      "Bo sugestie Copilota są zawsze w języku angielskim",
      "Bo Copilot może podpowiadać tylko jedną linię na raz",
      "Bo Copilot przewiduje kod na podstawie wzorców i nie zawsze rozumie nasz dokładny zamiar"
    ],
    correct: 3,
    explanation: "Copilot to model statystyczny - proponuje kod, który wygląda prawdopodobnie w danym kontekście. Nie rozumie logiki gry, więc może zasugerować coś składniowo poprawnego, ale logicznie błędnego."
  },
  {
    q: "Co kontroluje zmienna <code>anim</code> w strukturze karty?",
    code: '<span class="kw">def</span> <span class="fn">animate_card</span>(card, dt):\n    <span class="kw">if</span> card[<span class="str">"state"</span>] == <span class="str">"revealing"</span>:\n        card[<span class="str">"anim"</span>] -= dt * <span class="num">5</span>\n        <span class="kw">if</span> card[<span class="str">"anim"</span>] <= <span class="num">0</span>:\n            card[<span class="str">"anim"</span>] = <span class="num">0</span>\n            card[<span class="str">"state"</span>] = <span class="str">"revealed"</span>',
    options: [
      "Postęp animacji odwracania karty - maleje od 1.0 do 0.0, sterując efektem obrotu",
      "Numer klatki animacji wyświetlanej na ekranie",
      "Kąt obrotu karty w stopniach",
      "Czas w sekundach od ostatniego kliknięcia"
    ],
    correct: 0,
    explanation: "Zmienna anim startuje od 1.0 i maleje do 0.0. W połowie (0.5) karta jest \"niewidoczna\" - wtedy podmienia się obrazek z rewersu na awers. To tworzy złudzenie obrotu."
  },
  {
    q: "Co się dzieje w głównej pętli gry, gdy <code>freeze_timer</code> odlicza do zera?",
    code: '<span class="kw">if</span> freeze_timer > <span class="num">0</span>:\n    freeze_timer -= dt\n    <span class="kw">if</span> freeze_timer <= <span class="num">0</span>:\n        <span class="fn">check_pair</span>()',
    options: [
      "Gra się resetuje do stanu początkowego",
      "Wszystkie karty na planszy zostają zakryte",
      "Ekran wygranej pojawia się automatycznie",
      "Wywoływana jest funkcja check_pair, która sprawdza, czy dwie odkryte karty pasują do siebie"
    ],
    correct: 3,
    explanation: "freeze_timer daje graczowi sekundę na zobaczenie obu odkrytych kart, zanim gra zdecyduje, czy to para. Po odliczeniu check_pair porównuje wartości kart i zbiera parę lub zakrywa karty."
  }
];

let answered = 0;
let score = 0;
const container = document.getElementById("quizContainer");

function renderQuiz() {
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = `q${idx}`;

    const letters = ["A", "B", "C", "D"];
    let codeBlock = "";
    if (q.code) {
      codeBlock = `<div class="question-card__code">${q.code}</div>`;
    } else {
      codeBlock = `<div class="question-card__spacer"></div>`;
    }

    card.innerHTML = `
      <div class="question-card__number">Pytanie ${idx + 1} z ${QUESTIONS.length}</div>
      <div class="question-card__text">${q.q}</div>
      ${codeBlock}
      <div class="options">
        ${q.options.map((opt, oi) => `
          <div class="option" data-q="${idx}" data-o="${oi}" onclick="selectAnswer(this, ${idx}, ${oi})">
            <div class="option__letter">${letters[oi]}</div>
            <div class="option__text">${opt}</div>
          </div>
        `).join("")}
      </div>
      <div class="explanation" id="expl${idx}">${q.explanation}</div>
    `;

    container.appendChild(card);

    setTimeout(() => card.classList.add("visible"), 80 * idx);
  });
}

function selectAnswer(el, qIdx, oIdx) {
  const card = document.getElementById(`q${qIdx}`);
  const options = card.querySelectorAll(".option");
  const question = QUESTIONS[qIdx];

  options.forEach(o => o.classList.add("disabled"));

  const isCorrect = oIdx === question.correct;

  if (isCorrect) {
    el.classList.add("selected-correct");
    card.classList.add("correct", "pop");
    score++;
  } else {
    el.classList.add("selected-wrong");
    card.classList.add("wrong", "shake");
    options[question.correct].classList.add("reveal-correct");
  }

  const expl = document.getElementById(`expl${qIdx}`);
  expl.classList.add("show");

  answered++;
  updateProgress();

  if (answered === QUESTIONS.length) {
    setTimeout(showResults, 800);
  }
}

function updateProgress() {
  const pct = (answered / QUESTIONS.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${answered} / ${QUESTIONS.length}`;
}

function showResults() {
  const pct = Math.round((score / QUESTIONS.length) * 100);
  const res = document.getElementById("results");

  let emoji, msg;
  if (pct === 100) {
    emoji = "🏆"; msg = "Perfekcyjny wynik! Copilot byłby dumny.";
  } else if (pct >= 80) {
    emoji = "🎉"; msg = "Świetna robota! Opanowałeś materiał z lekcji.";
  } else if (pct >= 60) {
    emoji = "💪"; msg = "Dobry wynik! Warto powtórzyć kilka zagadnień.";
  } else {
    emoji = "📖"; msg = "Przejrzyj jeszcze raz konspekt i spróbuj ponownie!";
  }

  document.getElementById("resultsEmoji").textContent = emoji;
  document.getElementById("resultsScore").textContent = `${score} / ${QUESTIONS.length}`;
  document.getElementById("resultsMsg").textContent = msg;
  res.classList.add("show");

  setTimeout(() => res.scrollIntoView({ behavior: "smooth", block: "center" }), 200);
}

renderQuiz();
</script>
