<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Copilot Chat & Vibe Coding</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#0a0e1a;
    --surface:#111827;
    --surface-hi:#1a2236;
    --border:#243049;
    --cyan:#22d3ee;
    --cyan-dim:rgba(34,211,238,.12);
    --magenta:#e879f9;
    --magenta-dim:rgba(232,121,249,.10);
    --green:#34d399;
    --green-dim:rgba(52,211,153,.12);
    --red:#fb7185;
    --red-dim:rgba(251,113,133,.12);
    --yellow:#fbbf24;
    --text:#e2e8f0;
    --text-dim:#94a3b8;
    --radius:12px;
  }

  html{font-size:16px;scroll-behavior:smooth}

  body{
    font-family:'Outfit',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.6;
  }

  /* --- starfield --- */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars span{
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation:twinkle var(--d,3s) ease-in-out infinite alternate;
    opacity:.25;
  }
  @keyframes twinkle{0%{opacity:.15;transform:scale(.8)}100%{opacity:.7;transform:scale(1.2)}}

  /* --- layout --- */
  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:2.5rem 1.25rem 4rem}

  /* --- header --- */
  header{text-align:center;margin-bottom:2.5rem}
  header .badge{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:.7rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--cyan);
    background:var(--cyan-dim);
    border:1px solid rgba(34,211,238,.25);
    padding:.35rem .9rem;
    border-radius:999px;
    margin-bottom:1rem;
  }
  header h1{
    font-family:'Space Mono',monospace;
    font-size:clamp(1.5rem,5vw,2.1rem);
    font-weight:700;
    line-height:1.25;
    background:linear-gradient(135deg,var(--cyan),var(--magenta));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  header p{color:var(--text-dim);margin-top:.6rem;font-size:.95rem}

  /* --- progress --- */
  .progress-wrap{
    display:flex;align-items:center;gap:.75rem;
    margin-bottom:2rem;
    font-family:'Space Mono',monospace;
    font-size:.8rem;
    color:var(--text-dim);
  }
  .progress-bar{flex:1;height:6px;background:var(--surface-hi);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:99px;transition:width .45s ease}

  /* --- question card --- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:1.75rem 1.5rem;
    margin-bottom:1.25rem;
    transition:opacity .3s,transform .3s;
  }
  .card.hidden{display:none}
  .card .q-num{
    font-family:'Space Mono',monospace;
    font-size:.7rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--magenta);
    margin-bottom:.6rem;
  }
  .card .q-text{font-size:1.05rem;font-weight:600;margin-bottom:1.25rem;line-height:1.45}

  /* --- options --- */
  .options{display:flex;flex-direction:column;gap:.6rem}
  .opt{
    position:relative;
    display:flex;align-items:flex-start;gap:.75rem;
    background:var(--surface-hi);
    border:1px solid var(--border);
    border-radius:10px;
    padding:.85rem 1rem;
    cursor:pointer;
    transition:border-color .2s,background .2s,transform .15s;
    font-size:.93rem;
  }
  .opt:hover:not(.locked){border-color:var(--cyan);background:var(--cyan-dim);transform:translateX(3px)}
  .opt .marker{
    flex-shrink:0;
    width:26px;height:26px;
    border-radius:50%;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;
    font-size:.7rem;
    font-weight:700;
    color:var(--text-dim);
    transition:border-color .2s,background .2s,color .2s;
  }
  .opt:hover:not(.locked) .marker{border-color:var(--cyan);color:var(--cyan)}

  .opt.correct{border-color:var(--green);background:var(--green-dim)}
  .opt.correct .marker{border-color:var(--green);background:var(--green);color:var(--bg)}
  .opt.wrong{border-color:var(--red);background:var(--red-dim)}
  .opt.wrong .marker{border-color:var(--red);background:var(--red);color:var(--bg)}
  .opt.locked{cursor:default;opacity:.65}
  .opt.correct.locked{opacity:1}

  .explanation{
    margin-top:1rem;
    padding:.85rem 1rem;
    border-left:3px solid var(--cyan);
    background:var(--cyan-dim);
    border-radius:0 8px 8px 0;
    font-size:.88rem;
    line-height:1.55;
    color:var(--text);
    display:none;
  }
  .explanation.show{display:block;animation:fadeIn .35s ease}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* --- next button --- */
  .btn-next{
    display:none;
    margin:1.25rem auto 0;
    font-family:'Space Mono',monospace;
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--bg);
    background:linear-gradient(135deg,var(--cyan),var(--magenta));
    border:none;
    border-radius:999px;
    padding:.7rem 2rem;
    cursor:pointer;
    transition:transform .15s,box-shadow .2s;
  }
  .btn-next:hover{transform:scale(1.04);box-shadow:0 0 24px rgba(34,211,238,.3)}
  .btn-next.show{display:block}

  /* --- results --- */
  .results{
    text-align:center;
    padding:2.5rem 1.5rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .results.hidden{display:none}
  .results .score{
    font-family:'Space Mono',monospace;
    font-size:3.2rem;
    font-weight:700;
    background:linear-gradient(135deg,var(--cyan),var(--magenta));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .results .label{font-size:1rem;color:var(--text-dim);margin-top:.3rem}
  .results .verdict{font-size:1.15rem;font-weight:600;margin-top:1.2rem}
  .results .btn-restart{
    margin-top:1.5rem;
    font-family:'Space Mono',monospace;
    font-size:.82rem;
    font-weight:700;
    color:var(--cyan);
    background:transparent;
    border:1px solid var(--cyan);
    border-radius:999px;
    padding:.6rem 1.8rem;
    cursor:pointer;
    transition:background .2s,color .2s;
  }
  .results .btn-restart:hover{background:var(--cyan);color:var(--bg)}

  @media(max-width:520px){
    .wrap{padding:1.5rem 1rem 3rem}
    .card{padding:1.25rem 1rem}
    header h1{font-size:1.4rem}
  }

  /* --- language switcher --- */
  .lang-switch{display:flex;justify-content:center;gap:4px;width:fit-content;margin:0 auto 1.75rem;padding:4px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px}
  .lang-btn{font-family:'Space Mono',monospace;font-size:.75rem;font-weight:700;letter-spacing:.1em;min-width:44px;
    padding:.4rem .75rem;border:none;border-radius:999px;background:transparent;color:var(--text-dim);cursor:pointer;
    transition:background .2s,color .2s}
  .lang-btn:hover:not(.active){background:var(--surface-hi);color:var(--text)}
  .lang-btn.active{background:var(--cyan);color:var(--bg);cursor:default}
  .lang-btn:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  .no-anim .explanation.show{animation:none}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="lang-switch" role="group" aria-label="Język / Language / Idioma / Sprache">
    <button type="button" class="lang-btn" data-lang="pl" lang="pl" title="Polski" aria-label="Polski">PL</button>
    <button type="button" class="lang-btn" data-lang="en" lang="en" title="English" aria-label="English">EN</button>
    <button type="button" class="lang-btn" data-lang="es" lang="es" title="Español" aria-label="Español">ES</button>
    <button type="button" class="lang-btn" data-lang="de" lang="de" title="Deutsch" aria-label="Deutsch">DE</button>
  </div>

  <header>
    <div class="badge" id="tBadge">Powtorka z lekcji</div>
    <h1>Copilot Chat &amp; Vibe Coding</h1>
    <p id="tSub">10 pytań o budowaniu Space Shootera z AI</p>
  </header>

  <div class="progress-wrap">
    <span id="prog-label">0 / 10</span>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>

  <div id="quiz-container"></div>
  <button class="btn-next" id="btn-next">Następne pytanie →</button>

  <div class="results hidden" id="results">
    <div class="score" id="res-score"></div>
    <div class="label" id="tResultsLabel">poprawnych odpowiedzi</div>
    <div class="verdict" id="res-verdict"></div>
    <button class="btn-restart" id="tRestart" onclick="restart()">Zagraj ponownie</button>
  </div>
</div>

const CORRECT = [1, 1, 2, 1, 2, 1, 1, 1, 1, 1];
const LANGS = ['pl', 'en', 'es', 'de'];
const TOTAL = CORRECT.length;
let lang = 'pl';
const T = () => I18N[lang].ui;
const QS = () => I18N[lang].questions;
const fmt = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);

let current = 0, score = 0, answered = false, picked = null, resultsShown = false;

function init() {
  // starfield
  const sf = document.getElementById('stars');
  sf.innerHTML = '';
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('span');
    const size = Math.random() * 2.5 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s`;
    sf.appendChild(s);
  }
  let startLang = 'pl';
  try { const saved = localStorage.getItem('quizLang'); if (LANGS.includes(saved)) startLang = saved; } catch (e) { /* storage unavailable */ }
  setLang(startLang, false);
}

// keepState = re-render the same question in another language (answer, explanation and button stay)
function renderQuestion(keepState) {
  const c = document.getElementById('quiz-container');
  const d = QS()[current];
  const letters = ['A','B','C','D'];
  c.innerHTML = `
    <div class="card${keepState ? ' no-anim' : ''}" id="qcard">
      <div class="q-num">${fmt(T().qNum, { n: current + 1, total: TOTAL })}</div>
      <div class="q-text">${d.q}</div>
      <div class="options">
        ${d.opts.map((o,i) => `
          <div class="opt" data-idx="${i}" onclick="pick(this,${i})">
            <div class="marker">${letters[i]}</div>
            <div>${o}</div>
          </div>`).join('')}
      </div>
      <div class="explanation" id="expl">${d.explain}</div>
    </div>`;
  if (!keepState) {
    answered = false; picked = null;
    document.getElementById('btn-next').classList.remove('show');
  } else if (answered) {
    markAnswer(picked);
  }
  updateProgress();
}

function markAnswer(idx) {
  const correct = CORRECT[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.classList.add('locked'));
  if (idx === correct) opts[idx].classList.add('correct');
  else { opts[idx].classList.add('wrong'); opts[correct].classList.add('correct'); }
  document.getElementById('expl').classList.add('show');
  const btn = document.getElementById('btn-next');
  btn.textContent = current < TOTAL - 1 ? T().next : T().seeResult;
  btn.classList.add('show');
}

function pick(el, idx) {
  if (answered) return;
  answered = true;
  picked = idx;
  if (idx === CORRECT[current]) score++;
  markAnswer(idx);
  updateProgress();
}

document.getElementById('btn-next').addEventListener('click', () => {
  current++;
  if (current < TOTAL) renderQuestion(false);
  else showResults();
});

function updateProgress() {
  const done = resultsShown ? TOTAL : (answered ? current + 1 : current);
  document.getElementById('prog-label').textContent = `${done} / ${TOTAL}`;
  document.getElementById('prog-fill').style.width = `${(done/TOTAL)*100}%`;
}

function renderResults() {
  const ui = T();
  document.getElementById('res-score').textContent = `${score} / ${TOTAL}`;
  const pct = score / TOTAL;
  let v = '';
  if (pct === 1) v = ui.v100;
  else if (pct >= 0.8) v = ui.v80;
  else if (pct >= 0.6) v = ui.v60;
  else if (pct >= 0.4) v = ui.v40;
  else v = ui.v0;
  document.getElementById('res-verdict').textContent = v;
}

function showResults() {
  resultsShown = true;
  document.getElementById('quiz-container').innerHTML = '';
  document.getElementById('btn-next').classList.remove('show');
  updateProgress();
  document.getElementById('results').classList.remove('hidden');
  renderResults();
}

function restart() {
  current = 0; score = 0; resultsShown = false;
  document.getElementById('results').classList.add('hidden');
  renderQuestion(false);
}

// ---- language switching ----
function setLang(l, persist = true) {
  if (!LANGS.includes(l)) l = 'pl';
  lang = l;
  const ui = T();
  document.documentElement.lang = l;
  document.title = ui.title;
  document.getElementById('tBadge').textContent = ui.badge;
  document.getElementById('tSub').textContent = ui.sub;
  document.getElementById('tResultsLabel').textContent = ui.resultsLabel;
  document.getElementById('tRestart').textContent = ui.restart;
  document.querySelectorAll('.lang-btn').forEach(b => {
    const on = b.dataset.lang === l;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  if (persist) { try { localStorage.setItem('quizLang', l); } catch (e) { /* storage unavailable */ } }
  if (resultsShown) renderResults();
  else renderQuestion(true);
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

init();
</script>
